<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div id="app"></div>
  <div id="root"></div>
  <script type="module">
    // import { ref, render, Fragment, h, Teleport, provide, inject } from '/node_modules/@vue/runtime-dom/dist/runtime-dom.esm-browser.js'
    import { render, h, Text, Fragment, ref, effect, Teleport, provide, inject } from './runtime-dom.js'

    const P3 = {
      n: 'p3',
      setup() {
        const name = inject('name')
        const age = inject('age', 30)
        return () => h('div', null, [name.value, age])
      }
    }

    const P2 = {
      n: 'p2',
      setup() {
        return () => h(P3)
      }
    }

    const P1 = {
      n: 'p1',
      setup() {
        const name = ref('张三')
        provide('name', name)
         setTimeout(() => {
          name.value = '李四'
        }, 1000)
        return () => h(P2)
      }
    }

   

    render(h(P1), app)

  </script>
</body>
</html>
