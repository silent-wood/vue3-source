  <script type="module">

    const P2 = {
      n: 'p2',
      props: {
        value: Number
      },
      setup(props) {
        console.log('p2 setup')
        onBeforeMount(() => {
          console.log('p2 onBeforeMount')
        })
        onMounted(() => {
          console.log('p2 onMounted')
        })
        onUpdated(() => {
          console.log('p2 onUpdated')
        })
        onBeforeUpdate(() => {
          console.log('p2 onBeforeUpdate')
        })
        onUnmounted(() => {

    const P1 = {
      n: 'p1',
      setup() {

        onUpdated(() => {

        })

        })
        setTimeout(() => {
          // value.value = 2
          render(null, app)

        return () => h(P2, { value: value.value })

    }

   

    render(h(P1), app)
