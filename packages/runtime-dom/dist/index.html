<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div id="app"></div>
  <div id="root"></div>
  <script type="module">
    import { ref, render, Fragment, h, Teleport, provide, inject, Transition, KeepAlive, onMounted } from '/node_modules/vue/dist/vue.runtime.esm-browser.js'
    // import { render, h, Text, Fragment, ref, effect, Teleport, provide, inject, Transition } from './runtime-dom.js'
    
    const A1 = {
      setup() {
        onMounted(() => console.log('a1 mounted'))
        return () => h('div', 'a1')
      }
    }
    const A2 = {
      setup() {
        onMounted(() => console.log('a2 mounted'))
        return () => h('div', 'a2')
      }
    }
    const A3 = {
      setup() {
        onMounted(() => console.log('a3 mounted'))
        return () => h('div', 'a3')
      }
    }

    render(h(KeepAlive, h(A1)), app)

    setTimeout(() => {
      render(h(KeepAlive, h(A2)), app)
      setTimeout(() => {
        render(h(KeepAlive, h(A3)), app)
        setTimeout(() => {
          render(h(KeepAlive, h(A2)), app)
          setTimeout(() => {
            render(h(KeepAlive, h(A1)), app)
        }, 2000)
      }, 1000)
    }, 1000)
  },1000)

  </script>
</body>
</html>
