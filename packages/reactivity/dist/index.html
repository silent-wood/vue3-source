<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    // import { reactive, effect, ref, toRef } from '/node_modules/@vue/reactivity/dist/reactivity.esm-browser.js'
    import { reactive, effect, ref, toRef } from './reactivity.js';

    const state = reactive({ name: '张三', age: 12, flag: true, address: { n: 111 } });
    const name = toRef(state, 'name');
    console.log(name, 'name')
    effect(() => {
      app.innerHTML = name.value
    })
   
   setTimeout(() => {
     name.value = '李四'
     console.log(state)
   }, 2000)
  </script>
</body>
</html>
