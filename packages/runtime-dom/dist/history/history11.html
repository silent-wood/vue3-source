<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div id="app"></div>
  <div id="root"></div>
  <script type="module">
    // import { defineAsyncComponent, h, render } from '/node_modules/vue/dist/vue.runtime.esm-browser.js'
    // import { render, h, Text, Fragment, ref, effect, Teleport, provide, inject, Transition } from './runtime-dom.js'
    import { defineAsyncComponent, h, render } from './runtime-dom.js'

    const MyComponent = defineAsyncComponent({
      loader: () => {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          reject({
            render() {
              return () => h('div', 'hello world')
            }
          })
        }, 3000)
      })
    },
    delay: 300,
    timeout: 1000,
    loadingComponent: {
      render: () => h('div', 'loading')
    },
    errorComponent: {
      render: () => h('div', 'error')
    },
  })

    render(h(MyComponent), app)
    

  </script>
</body>
</html>
